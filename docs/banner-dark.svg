<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Фарватер">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#0E1626"/><stop offset="1" stop-color="#04060B"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB547" stop-opacity="0.55"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
  <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB547" stop-opacity="0.75"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient>
  <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#FFB547" stop-opacity="0.6"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
  <style>
    .beam { transform-origin: 222px 180px; animation: sweep 6s ease-in-out infinite alternate; }
    .lamp { animation: pulse 3s ease-in-out infinite; }
    .w1 { animation: drift 9s linear infinite; }
    .w2 { animation: drift 14s linear infinite reverse; }
    .tw { animation: twinkle 4s ease-in-out infinite; }
    @keyframes sweep { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-160px); } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</defs>
