name: Эмулятор

on:
  push:
    branches: [ccr-b5614196-xgdfs2]
    paths: [".github/workflows/emulator.yml"]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK 1.0.15 и 1.0.16
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in 1.0.15 1.0.16; do
            gh release download "v$v" -R "$GITHUB_REPOSITORY" -p "Farvater-$v-x86_64.apk" -D apk
          done
          ls -la apk

      - name: Сценарий
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u
          PKG=app.farvater
          ACT=$PKG/.MainActivity
          OUT=$GITHUB_WORKSPACE/out
          SUM=$OUT/summary.md
          mkdir -p "$OUT"
          say() { echo "== $*"; echo "$*" >> "$SUM"; }
          shot() { adb exec-out screencap -p > "$OUT/$1.png"; }

          tap() {
            local xy=""
            for attempt in 1 2 3; do
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              xy=$(adb shell cat /sdcard/ui.xml | python3 -c '
          import re, sys
          want = sys.argv[1]
          hits = []
          for n in re.findall(r"<node [^>]*>", sys.stdin.read()):
              t = re.search(r" text=\"([^\"]*)\"", n)
              d = re.search(r" content-desc=\"([^\"]*)\"", n)
              if want in ((t.group(1) if t else ""), (d.group(1) if d else "")):
                  x1, y1, x2, y2 = map(int, re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"", n).groups())
                  hits.append(((y1 + y2) // 2, (x1 + x2) // 2))
          if hits:
              y, x = max(hits)
              print(x, y)
          ' "$1")
              [ -n "$xy" ] && break
              sleep 2
            done
            if [ -z "$xy" ]; then say "Не нашёл на экране «$1»"; return 1; fi
            adb shell input tap $xy
          }

          install() {
            adb uninstall $PKG >/dev/null 2>&1
            adb install "$1" >/dev/null || { say "Не установился $1"; return 1; }
            adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS 2>/dev/null
            adb shell appops set $PKG ACTIVATE_VPN allow
          }

          launches() {
            install "apk/Farvater-$1-x86_64.apk" || return
            adb shell cmd package compile -m speed -f $PKG >/dev/null
            for i in 1 2; do adb shell am force-stop $PKG; adb shell am start -W -n $ACT >/dev/null; sleep 4; done
            for i in $(seq 1 8); do
              adb shell am force-stop $PKG
              sleep 2
              adb shell am start -W -n $ACT | tr -d '\r' | awk '/TotalTime/ {print $2}' >> "$OUT/start-$1.txt"
              sleep 3
            done
          }

          gfx() {
            adb shell dumpsys gfxinfo $PKG reset >/dev/null
            for i in $(seq 1 6); do
              adb shell input swipe 540 1900 540 600 250
              sleep 0.6
              adb shell input swipe 540 600 540 1900 250
              sleep 0.6
            done
            adb shell dumpsys gfxinfo $PKG > "$OUT/gfx-$1.txt"
            say "Прокрутка узлов, $1: $(grep -E 'Total frames rendered|Janky frames:|50th percentile|90th percentile|99th percentile' "$OUT/gfx-$1.txt" | head -5 | tr -s ' ' | tr '\n' ';')"
          }

          echo "# Эмулятор: Android $(adb shell getprop ro.build.version.release | tr -d '\r'), $(adb shell wm size | tr -d '\r')" > "$SUM"
          adb logcat -c

          for round in 1 2; do
            launches 1.0.15
            launches 1.0.16
          done
          for v in 1.0.15 1.0.16; do
            say "Холодный запуск $v, мс: $(tr '\n' ' ' < "$OUT/start-$v.txt")— медиана $(python3 -c 'import statistics,sys; print(statistics.median(int(x) for x in open(sys.argv[1]) if x.strip()))' "$OUT/start-$v.txt")"
          done

          install apk/Farvater-1.0.16-x86_64.apk
          adb shell am start -W -n $ACT >/dev/null
          sleep 6
          shot 01-onboarding
          tap "Включить публичные"
          sleep 45
          shot 02-home
          tap "Источники" && sleep 4 && shot 03-sources
          tap "Фарватер" && sleep 3
          tap "Найти рабочий узел"
          vpn=no
          for i in $(seq 1 60); do
            if adb shell ip link show tun0 >/dev/null 2>&1; then vpn=yes; break; fi
            sleep 5
          done
          say "VPN поднялся: $vpn"
          sleep 25
          shot 04-home-connected
          adb shell dumpsys connectivity | grep -iE "VPN.*(VALIDATED|CONNECTED)" | head -3 > "$OUT/vpn.txt"
          say "Сеть VPN: $(tr '\n' ' ' < "$OUT/vpn.txt" | cut -c1-300)"

          adb shell dumpsys battery unplug
          tap "Узлы" && sleep 4
          shot 05-servers-glass
          gfx glass
          adb shell cmd power set-mode 1
          sleep 3
          say "Энергосбережение: $(adb shell settings get global low_power | tr -d '\r')"
          shot 06-servers-powersave
          gfx powersave
          tap "Фарватер" && sleep 3
          shot 07-home-powersave
          adb shell cmd power set-mode 0
          sleep 3
          shot 08-home-glass-back
          tap "Отключиться" && sleep 4
          adb shell dumpsys battery reset

          adb logcat -d -b crash > "$OUT/crash.txt"
          adb logcat -d > "$OUT/logcat.txt"
          say "Падения: $(grep -c 'FATAL EXCEPTION' "$OUT/crash.txt") ; ANR: $(grep -c "ANR in $PKG" "$OUT/logcat.txt")"
          grep -A15 'FATAL EXCEPTION' "$OUT/crash.txt" | head -40 >> "$SUM"
          cat "$SUM"
          EOF
          chmod +x "$RUNNER_TEMP/check.sh"

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash $RUNNER_TEMP/check.sh

      - name: Итог
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: out/

      - name: В ветку screenshots
        if: always()
        run: |
          ls out/*.png >/dev/null 2>&1 || exit 0
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin screenshots
          git worktree add -B screenshots shots FETCH_HEAD
          mkdir -p shots/emulator
          rm -f shots/emulator/*
          cp out/*.png out/summary.md shots/emulator/
          cd shots
          git add -A
          git commit -q -m "emulator ${GITHUB_SHA::7}" || exit 0
          for i in 1 2 3; do
            git push origin screenshots && exit 0
            git fetch --depth 1 origin screenshots && git rebase FETCH_HEAD || exit 1
          done
          exit 1
