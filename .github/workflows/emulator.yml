name: Эмулятор

on:
  push:
    branches: [ccr-b5614196-xgdfs2]
    paths: [".github/workflows/emulator.yml"]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        apk: [x86_64, universal]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Perfetto
        if: matrix.apk == 'x86_64'
        run: pip install perfetto

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.15 -R "$GITHUB_REPOSITORY" -p "Farvater-1.0.15-x86_64.apk" -D apk
          gh release download v1.0.16 -R "$GITHUB_REPOSITORY" -p "Farvater-1.0.16-x86_64.apk" -p "Farvater-1.0.16-universal.apk" -p "Farvater-1.0.16-arm64-v8a.apk" -D apk
          ls -la apk

      - name: Сценарий
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u
          PKG=app.farvater
          ACT=$PKG/.MainActivity
          VARIANT=$1
          OUT=$GITHUB_WORKSPACE/out/$VARIANT
          SUM=$OUT/summary.md
          mkdir -p "$OUT/traces"
          say() { echo "== $*"; echo "- $*" >> "$SUM"; }
          shot() { adb exec-out screencap -p > "$OUT/$1.png"; }
          calm() { adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1; }

          find_xy() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb shell cat /sdcard/ui.xml | python3 -c '
          import re, sys
          want = sys.argv[1]
          hits = []
          for n in re.findall(r"<node [^>]*>", sys.stdin.read()):
              t = re.search(r" text=\"([^\"]*)\"", n)
              d = re.search(r" content-desc=\"([^\"]*)\"", n)
              if want in ((t.group(1) if t else ""), (d.group(1) if d else "")):
                  x1, y1, x2, y2 = map(int, re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"", n).groups())
                  hits.append(((y1 + y2) // 2, (x1 + x2) // 2))
          if hits:
              y, x = max(hits)
              print(x, y)
          ' "$1"
          }

          tap() {
            local xy=""
            for attempt in 1 2 3 4 5; do
              calm
              xy=$(find_xy "$1")
              [ -n "$xy" ] && break
              local wait_xy
              wait_xy=$(find_xy "Wait")
              [ -n "$wait_xy" ] && adb shell input tap $wait_xy
              sleep 3
            done
            if [ -z "$xy" ]; then say "Не нашёл на экране «$1»"; shot "missing-$1"; return 1; fi
            adb shell input tap $xy
          }

          install() {
            adb uninstall $PKG >/dev/null 2>&1
            adb install "$1" >/dev/null 2>"$OUT/install.err" || { say "Не установился $(basename "$1"): $(tr '\n' ' ' < "$OUT/install.err")"; return 1; }
            adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS 2>/dev/null
            adb shell appops set $PKG ACTIVATE_VPN allow
          }

          launches() {
            install "apk/Farvater-$1-x86_64.apk" || return
            adb shell cmd package compile -m speed -f $PKG >/dev/null
            for i in 1 2; do adb shell am force-stop $PKG; adb shell am start -W -n $ACT >/dev/null; sleep 4; done
            for i in $(seq 1 5); do
              adb shell am force-stop $PKG
              sleep 3
              adb shell rm -f /data/misc/perfetto-traces/t.pftrace
              adb shell perfetto -o /data/misc/perfetto-traces/t.pftrace -t 8s sched am wm >/dev/null 2>&1 &
              local tracer=$!
              sleep 2
              adb shell am start -W -n $ACT | tr -d '\r' | awk '/TotalTime/ {print $2}' >> "$OUT/start-$1.txt"
              wait $tracer
              adb pull /data/misc/perfetto-traces/t.pftrace "$OUT/traces/$1-$2-$i.pftrace" >/dev/null 2>&1
              sleep 2
            done
          }

          gfx() {
            adb shell dumpsys gfxinfo $PKG reset >/dev/null
            for i in $(seq 1 6); do
              adb shell input swipe 540 1900 540 700 250
              sleep 0.7
              adb shell input swipe 540 700 540 1900 250
              sleep 0.7
            done
            adb shell dumpsys gfxinfo $PKG > "$OUT/gfx-$1.txt"
            say "Прокрутка узлов, $1: $(grep -E 'Total frames rendered|Janky frames:|50th percentile|90th percentile|99th percentile' "$OUT/gfx-$1.txt" | head -5 | tr -s ' ' | tr '\n' ';')"
          }

          adb shell settings put global hide_error_dialogs 1
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          sleep 60
          calm
          echo "# $VARIANT: Android $(adb shell getprop ro.build.version.release | tr -d '\r'), $(adb shell wm size | tr -d '\r')" > "$SUM"
          adb logcat -c

          if [ "$VARIANT" = x86_64 ]; then
            for round in 1 2 3; do
              launches 1.0.15 $round
              launches 1.0.16 $round
            done
            for v in 1.0.15 1.0.16; do
              say "Холодный запуск $v (TotalTime), мс: $(tr '\n' ' ' < "$OUT/start-$v.txt")— медиана $(python3 -c 'import statistics,sys; print(statistics.median(int(x) for x in open(sys.argv[1]) if x.strip()))' "$OUT/start-$v.txt")"
            done
            python3 - "$OUT" >> "$SUM" <<'PY'
          import glob, os, statistics, sys
          from perfetto.trace_processor import TraceProcessor
          out = sys.argv[1]
          found = {}
          for f in sorted(glob.glob(os.path.join(out, "traces", "*.pftrace"))):
              version = os.path.basename(f).split("-")[0]
              try:
                  tp = TraceProcessor(trace=f)
                  rows = tp.query("""
                      select s.dur as dur, p.name as pname from slice s
                      join thread_track tt on s.track_id = tt.id
                      join thread t using(utid)
                      left join process p using(upid)
                      where s.name = 'bindApplication'
                  """)
                  rows = [(r.dur / 1e6, r.pname or "") for r in rows]
                  durs = [d for d, n in rows if "farvater" in n] or [d for d, n in rows]
                  tp.close()
              except Exception as e:
                  print(f"- трасса {os.path.basename(f)}: {e}")
                  continue
              if durs:
                  found.setdefault(version, []).append(round(max(durs)))
          for version, values in sorted(found.items()):
              print(f"- bindApplication (App.onCreate) {version}, мс: {' '.join(map(str, values))} — медиана {statistics.median(values)}")
          PY
          fi

          install apk/Farvater-1.0.16-$VARIANT.apk
          say "ABI после установки: $(adb shell dumpsys package $PKG | grep -m1 primaryCpuAbi | tr -d '\r' | xargs)"
          adb shell am start -W -n $ACT >/dev/null
          sleep 8
          shot 01-onboarding
          tap "Включить публичные"
          sleep 50
          shot 02-home
          tap "Источники" && sleep 4 && shot 03-sources
          tap "Фарватер" && sleep 3
          tap "Найти рабочий узел"
          vpn=no
          for i in $(seq 1 72); do
            if adb shell ip link show tun0 >/dev/null 2>&1; then vpn=yes; break; fi
            sleep 5
          done
          say "VPN поднялся: $vpn (ждал $((i * 5)) с)"
          sleep 30
          calm
          shot 04-home-connected
          say "VPN в системе: $(adb shell dumpsys connectivity | grep -m1 -E 'ni\{VPN' | grep -oE 'ni\{VPN[^}]*\}|IS_VALIDATED' | tr '\n' ' ')"

          adb shell dumpsys battery unplug
          tap "Узлы" && sleep 4
          shot 05-servers-glass
          gfx glass
          adb shell cmd power set-mode 1
          sleep 3
          say "Энергосбережение включено: $(adb shell settings get global low_power | tr -d '\r')"
          shot 06-servers-powersave
          gfx powersave
          tap "Фарватер" && sleep 3
          shot 07-home-powersave
          adb shell cmd power set-mode 0
          sleep 3
          shot 08-home-glass-back
          tap "Отключиться" && sleep 5
          say "VPN после отключения: $(adb shell ip link show tun0 >/dev/null 2>&1 && echo остался || echo выключен)"
          adb shell dumpsys battery reset

          adb logcat -d -b crash > "$OUT/crash.txt"
          adb logcat -d > "$OUT/logcat.txt"
          say "Падения Фарватера: $(grep -c "Process: $PKG" "$OUT/crash.txt"); ANR Фарватера: $(grep -c "ANR in $PKG" "$OUT/logcat.txt")"
          grep -B2 -A20 "Process: $PKG" "$OUT/crash.txt" | head -60 >> "$SUM"

          if [ "$VARIANT" = universal ]; then
            adb logcat -c
            if install apk/Farvater-1.0.16-arm64-v8a.apk; then
              say "arm64-v8a поставился, ABI: $(adb shell dumpsys package $PKG | grep -m1 primaryCpuAbi | tr -d '\r' | xargs)"
              adb shell am start -W -n $ACT >/dev/null
              sleep 15
              shot 09-arm64
              adb logcat -d -b crash > "$OUT/crash-arm64.txt"
              say "arm64-v8a: процесс $(adb shell pidof $PKG >/dev/null && echo жив || echo не запущен), падений $(grep -c "Process: $PKG" "$OUT/crash-arm64.txt")"
            fi
          fi
          cat "$SUM"
          EOF
          chmod +x "$RUNNER_TEMP/check.sh"

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash $RUNNER_TEMP/check.sh ${{ matrix.apk }}

      - name: Итог
        if: always()
        run: cat "out/${{ matrix.apk }}/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.apk }}
          path: out/

      - name: В ветку screenshots
        if: always()
        run: |
          ls out/${{ matrix.apk }}/*.png >/dev/null 2>&1 || exit 0
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin screenshots
          git worktree add -B screenshots shots FETCH_HEAD
          rm -rf shots/emulator/*.png shots/emulator/summary.md "shots/emulator/${{ matrix.apk }}"
          mkdir -p "shots/emulator/${{ matrix.apk }}"
          cp out/${{ matrix.apk }}/*.png out/${{ matrix.apk }}/summary.md "shots/emulator/${{ matrix.apk }}/"
          cd shots
          git add -A
          git commit -q -m "emulator ${{ matrix.apk }} ${GITHUB_SHA::7}" || exit 0
          for i in 1 2 3 4 5; do
            git push origin screenshots && exit 0
            sleep $((i * 3))
            git fetch --depth 1 origin screenshots && git rebase FETCH_HEAD || exit 1
          done
          exit 1
