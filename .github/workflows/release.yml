name: Релиз

# запуск по тегу v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # пакета tools больше нет в SDK
          packages: platform-tools

      - name: NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Ядро и TUN-мост
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-natives.sh

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.FARVATER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Нет секрета FARVATER_KEYSTORE_BASE64 — релиз без подписи выпускать нельзя"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FARVATER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Тесты и release-сборка
        env:
          FARVATER_KEYSTORE_PASSWORD: ${{ secrets.FARVATER_KEYSTORE_PASSWORD }}
          FARVATER_KEY_ALIAS: ${{ secrets.FARVATER_KEY_ALIAS }}
          FARVATER_KEY_PASSWORD: ${{ secrets.FARVATER_KEY_PASSWORD }}
        # версия из тега, обновления приложение ищет в этом же репозитории
        run: >
          gradle :app:testReleaseUnitTest :app:assembleRelease
          -PfarvaterVersion=${{ github.ref_name }}
          -PfarvaterUpdateRepo=${{ github.repository }}

      - name: Файлы релиза, update.json и отпечаток ключа
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-(.*)-release$/\1/')
            cp "$apk" "dist/Farvater-${VERSION}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs dist/*universal*.apk | grep -m1 'SHA-256' | awk -F': ' '{print $2}')
          python3 scripts/make-update-json.py "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" release-notes.txt dist > dist/update.json
          cat dist/update.json
          {
            echo "Что нового:"
            python3 -c "import json;[print('- '+n) for n in json.load(open('dist/update.json'))['notes']]"
            echo
            echo "Какой файл скачать: почти всем телефонам подходит arm64-v8a. Если не уверены, universal."
            echo
            echo "Отпечаток сертификата подписи (SHA-256): $CERT"
            echo
            echo "Контрольные суммы в файле SHA256SUMS.txt."
          } > dist/NOTES.md
          cat dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Фарватер ${{ github.ref_name }}
          body_path: dist/NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/update.json

      # копия update.json в ветке updates: зеркала raw.githubusercontent и jsDelivr
      - name: Ветка updates
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin updates; then
            git worktree add -B updates upd FETCH_HEAD
          else
            git worktree add --orphan -b updates upd
          fi
          cp dist/update.json upd/update.json
          cd upd
          git add update.json
          git commit -q -m "update.json ${GITHUB_REF_NAME}" || exit 0
          git push origin updates
